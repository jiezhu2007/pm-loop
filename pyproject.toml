[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-loop"
version = "0.1.0"
description = "Durable PM Loop control plane, scheduler, worker, evidence and read-only cockpit"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "scripts"]
addopts = "-q"
